<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Care - Report Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#c0ded9] min-h-screen flex flex-col font-sans antialiased text-gray-800">

    <!-- Navigation Bar -->
    <nav id="nav" class="bg-[#3b3a30] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Fixed text color classes -->
            <span class="font-extrabold text-2xl tracking-wider">
                <span class="text-white">CITY</span><span class="text-[#b2c2bf]">CARE</span>
            </span>
            <ul class="flex items-center space-x-6 font-medium">
                <li>
                    <a href="#" class="px-4 py-2 rounded-lg bg-red-400 hover:bg-red-500 text-white font-semibold transition duration-200 shadow-sm">
                        Report Issue
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main" class="flex-grow flex items-center justify-center p-6 my-6">
        <!-- Fixed unclosed div and border syntax -->
        <div class="bg-white/80 backdrop-blur-md p-8 md:p-10 rounded-2xl shadow-xl max-w-2xl w-full border border-white/40">
            <h1 class="text-3xl font-extrabold text-[#3b3a30] mb-3 text-center tracking-tight">
                REPORT ANY ISSUE INSTANTLY
            </h1>
            <p class="text-gray-600 mb-8 text-center leading-relaxed max-w-md mx-auto">
                Help us keep our city clean and safe. Submit potholes, street light outages, or waste management requests directly to the municipality.
            </p>

           
        </div>
    </main>

</body>
</html>
