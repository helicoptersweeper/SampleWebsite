<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-cyan-50 min-h-screen flex flex-col justify-center items-center font-sans antialiased text-gray-800">

<div class="w-full max-w-md p-8 bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-cyan-100">

<h2 class="text-3xl font-extrabold text-sky-600 mb-6 text-center tracking-tight">Login</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes mb-6 space-y-2">
    {% for message in messages %}
      <li class="bg-lime-50 border border-lime-200 text-lime-900 px-4 py-2.5 rounded-lg text-sm font-medium shadow-sm">
        {{ message }}
      </li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

{% block body %}{% endblock %}

<form method="POST" class="space-y-5">

    <div>
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
            class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition duration-200"
        >
    </div>

    <div>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition duration-200"
        >
    </div>

    <button 
        type="submit"
        class="w-full py-3.5 px-4 bg-lime-200 hover:bg-lime-300 text-lime-950 font-bold rounded-xl shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-lime-300 focus:ring-offset-2 transition duration-200 active:scale-[0.99]"
    >
        Login
    </button>

</form>

<p class="mt-6 text-center text-sm text-gray-600">
    Don't have an account?
    <a href="/register" class="text-sky-600 hover:text-sky-700 font-semibold underline underline-offset-2 transition duration-150">Register</a>
</p>

</div>

</body>

</html>
